<!DOCTYPE html>
<!--
  Math Practice — an arithmetic practice app for kids
  ============================================================
  Version: 1.1.5
  NOTE: bump this version (and the VERSION constant in the
  <script> below) on every new iteration in this conversation.
  ============================================================
-->
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Math Practice</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#141518;
    --surface:#1c1d22;
    --surface-2:#24252c;
    --border:#2e2f38;
    --border-soft:#26272f;
    --text:#e9e9ec;
    --text-dim:#9a9aa6;
    --text-faint:#62636e;
    --accent:#7cdcc4;
    --accent-deep:#152823;
    --ok:#6fd089;
    --bad:#e8736f;
    --track:#34353f;
    --radius:14px;
    --radius-sm:9px;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Manrope',-apple-system,BlinkMacSystemFont,sans-serif;
    font-size:15px;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
    padding:34px 20px 80px;
  }
  .wrap{max-width:760px;margin:0 auto;}

  /* ---------- header ---------- */
  header{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin-bottom:30px;}
  h1{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:30px;
    letter-spacing:-0.01em;
    line-height:1.1;
  }
  .subtitle{color:var(--text-dim);font-size:13.5px;margin-top:5px;}
  .ver{
    color:var(--text-faint);font-size:11px;margin-top:7px;
    font-family:'JetBrains Mono',monospace;letter-spacing:.03em;
  }
  .lang{display:flex;gap:4px;background:var(--surface);border:1px solid var(--border);border-radius:999px;padding:3px;flex-shrink:0;}
  .lang button{
    border:none;background:transparent;color:var(--text-dim);
    font-family:inherit;font-weight:600;font-size:12px;letter-spacing:.03em;
    padding:5px 11px;border-radius:999px;cursor:pointer;transition:.18s;
  }
  .lang button.on{background:var(--accent);color:#0e1714;}

  /* ---------- card ---------- */
  .card{
    background:var(--surface);
    border:1px solid var(--border-soft);
    border-radius:var(--radius);
    padding:22px;
    margin-bottom:18px;
  }
  .card-head{display:flex;align-items:center;justify-content:space-between;cursor:pointer;user-select:none;}
  .card:not(.collapsed) .card-head{margin-bottom:20px;}
  .card-title{
    font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;
    color:var(--text-faint);
  }
  .chev{width:15px;height:15px;color:var(--text-faint);transition:transform .2s ease;}
  .card.collapsed .chev{transform:rotate(-90deg);}
  .card.collapsed .card-body{display:none;}

  /* ---------- operation chips ---------- */
  .ops{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-bottom:22px;}
  .op-chip{
    display:flex;flex-direction:column;align-items:center;gap:3px;
    padding:12px 6px;border:1.5px solid var(--border);border-radius:var(--radius-sm);
    background:var(--surface-2);cursor:pointer;transition:.16s;user-select:none;
  }
  .op-chip .sym{font-family:'JetBrains Mono',monospace;font-size:24px;line-height:1;color:var(--text-dim);transition:.16s;}
  .op-chip .lbl{font-size:11.5px;color:var(--text-faint);transition:.16s;}
  .op-chip.on{border-color:var(--accent);background:var(--accent-deep);}
  .op-chip.on .sym{color:var(--accent);}
  .op-chip.on .lbl{color:var(--text);}

  /* ---------- settings grid ---------- */
  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px 22px;}
  .field{display:flex;flex-direction:column;gap:7px;}
  .field > label{font-size:12.5px;color:var(--text-dim);font-weight:600;}
  .range-row{display:flex;align-items:center;gap:8px;}
  .range-row span{font-size:11px;color:var(--text-faint);}
  input[type=number]{width:100%;}
  input[type=number],select{
    background:var(--surface-2);border:1px solid var(--border);color:var(--text);
    font-family:'JetBrains Mono',monospace;font-size:14px;
    padding:9px 11px;border-radius:var(--radius-sm);transition:.16s;
  }
  select{font-family:'Manrope',sans-serif;cursor:pointer;}
  input[type=number]:focus,select:focus{outline:none;border-color:var(--accent);}
  input[type=number]:disabled,select:disabled{opacity:.4;cursor:not-allowed;}

  /* ---------- switch rows ---------- */
  .switch-row{
    display:flex;align-items:center;justify-content:space-between;gap:14px;
    padding:11px 0;border-top:1px solid var(--border-soft);
  }
  .switch-row .txt{display:flex;flex-direction:column;}
  .switch-row .txt b{font-weight:600;font-size:13.5px;}
  .switch-row .txt small{color:var(--text-faint);font-size:11.5px;}
  .switch{position:relative;width:42px;height:24px;flex-shrink:0;}
  .switch input{opacity:0;width:0;height:0;}
  .track{
    position:absolute;inset:0;background:var(--surface-2);border:1px solid var(--border);
    border-radius:999px;cursor:pointer;transition:.18s;
  }
  .track::after{
    content:"";position:absolute;width:16px;height:16px;left:3px;top:3px;
    background:var(--text-faint);border-radius:50%;transition:.18s;
  }
  .switch input:checked + .track{background:var(--accent-deep);border-color:var(--accent);}
  .switch input:checked + .track::after{transform:translateX(18px);background:var(--accent);}

  /* ---------- buttons ---------- */
  .btn{
    width:100%;border:none;border-radius:var(--radius-sm);cursor:pointer;
    font-family:inherit;font-weight:700;font-size:14.5px;padding:14px;
    transition:.16s;letter-spacing:.01em;
  }
  .btn-primary{background:var(--accent);color:#0e1714;}
  .btn-primary:hover{filter:brightness(1.08);}
  .btn-ghost{background:var(--surface-2);color:var(--text);border:1px solid var(--border);}
  .btn-ghost:hover{border-color:var(--accent);color:var(--accent);}
  .btn:disabled{opacity:.35;cursor:not-allowed;filter:none;}

  /* ---------- equations ---------- */
  #board{margin-top:18px;}
  .warn{
    background:#2a2118;border:1px solid #5a4427;color:#e7c690;
    border-radius:var(--radius-sm);padding:13px 15px;font-size:13px;margin-bottom:16px;
  }
  .empty{color:var(--text-faint);text-align:center;font-size:13.5px;padding:30px 0;}
  .eq{
    display:flex;flex-wrap:wrap;align-items:center;gap:9px 12px;
    padding:12px 16px;border:1px solid var(--border-soft);border-radius:var(--radius-sm);
    background:var(--surface);margin-bottom:9px;
    animation:rise .35s ease both;
  }
  @keyframes rise{from{opacity:0;transform:translateY(7px);}to{opacity:1;transform:none;}}
  .eq .idx{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--text-faint);width:22px;flex-shrink:0;}
  .eq .expr{
    font-family:'JetBrains Mono',monospace;font-size:16px;font-weight:500;
    flex:1;min-width:90px;white-space:nowrap;overflow-x:auto;
  }
  .eq .ans{
    width:86px;height:46px;text-align:center;flex-shrink:0;
    font-family:'JetBrains Mono',monospace;font-size:16px;font-weight:700;
    background:var(--surface-2);border:1px solid var(--border);color:var(--text);
    border-radius:var(--radius-sm);transition:.16s;
  }
  .eq .ans:focus{outline:none;border-color:var(--accent);}
  .eq .ans.ok{border-color:var(--ok);color:var(--ok);}
  .eq .ans.bad{border-color:var(--bad);color:var(--bad);}
  .eq .mark{
    width:32px;flex-shrink:0;text-align:center;
    font-size:23px;line-height:1;
  }
  .eq .correct{
    flex-basis:100%;padding-left:34px;margin-top:1px;
    font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--accent);
    white-space:nowrap;overflow-x:auto;
  }
  .eq .correct:empty{display:none;}
  .actions{display:grid;grid-template-columns:1fr;gap:10px;margin-top:8px;}

  /* ---------- results card & progress bars ---------- */
  .score{margin-top:14px;}
  .score .card-body{text-align:center;}
  .score .pct{font-family:'Fraunces',serif;font-size:34px;font-weight:600;}
  .score .detail{color:var(--text-dim);font-size:13px;margin-top:2px;}
  .pbar{height:9px;border-radius:999px;background:var(--track);overflow:hidden;display:flex;}
  .pbar > div{height:100%;transition:width .35s ease;}
  .score .pbar.top{margin-bottom:15px;}
  .score .pbar.bottom{margin-top:15px;}

  @media(max-width:560px){
    .grid{grid-template-columns:1fr;}
    .ops{grid-template-columns:repeat(2,1fr);}
    h1{font-size:25px;}
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div>
      <h1 id="t-title">Math Practice</h1>
      <div class="subtitle" id="t-subtitle"></div>
      <div class="ver" id="ver"></div>
    </div>
    <div class="lang">
      <button id="lang-en" onclick="setLang('en')">EN</button>
      <button id="lang-cs" onclick="setLang('cs')">CZ</button>
    </div>
  </header>

  <!-- ============ SETTINGS ============ -->
  <div class="card" id="settings-card">
    <div class="card-head" onclick="toggleSettings()">
      <span class="card-title" id="t-settings">Settings</span>
      <svg class="chev" viewBox="0 0 16 16"><path d="M4 6 L8 10 L12 6" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </div>
    <div class="card-body">
      <div class="ops" id="ops"></div>

      <div class="grid">
        <div class="field">
          <label id="t-oprange">Number range</label>
          <div class="range-row">
            <span id="t-min1">min</span>
            <input type="number" id="opMin">
            <span id="t-max1">max</span>
            <input type="number" id="opMax">
          </div>
        </div>
        <div class="field">
          <label id="t-resrange">Result range</label>
          <div class="range-row">
            <span id="t-min2">min</span>
            <input type="number" id="resMin">
            <span id="t-max2">max</span>
            <input type="number" id="resMax">
          </div>
        </div>
        <div class="field">
          <label id="t-count">Number of equations</label>
          <select id="count">
            <option>5</option><option>10</option><option>15</option><option>20</option><option>30</option>
          </select>
        </div>
        <div class="field">
          <label id="t-operands">Number of terms</label>
          <select id="operands">
            <option>2</option><option>3</option><option>4</option><option>5</option>
            <option>6</option><option>7</option><option>8</option>
          </select>
        </div>
        <div class="field">
          <label id="t-brackets">Bracket groups</label>
          <select id="brackets">
            <option>0</option><option>1</option><option>2</option><option>3</option>
          </select>
        </div>
        <div class="field" id="dplaces-field">
          <label id="t-dplaces">Decimal places</label>
          <select id="dplaces">
            <option>0</option><option>1</option><option>2</option>
          </select>
        </div>
      </div>

      <div style="margin-top:6px">
        <div class="switch-row">
          <div class="txt"><b id="t-dec-b">Include decimals</b><small id="t-dec-s">Allow non-whole numbers</small></div>
          <label class="switch"><input type="checkbox" id="decimals"><span class="track"></span></label>
        </div>
        <div class="switch-row">
          <div class="txt"><b id="t-auto-b">Auto-bracket</b><small id="t-auto-s">Always bracket multiplication and division</small></div>
          <label class="switch"><input type="checkbox" id="autoBracket"><span class="track"></span></label>
        </div>
        <div class="switch-row">
          <div class="txt"><b id="t-show-b">Show correct answers</b><small id="t-show-s">Reveal answers when checking</small></div>
          <label class="switch"><input type="checkbox" id="showCorrect"><span class="track"></span></label>
        </div>
      </div>
    </div>
  </div>

  <button class="btn btn-primary" id="btn-gen" onclick="generate()">Generate equations</button>

  <!-- ============ BOARD ============ -->
  <div id="board">
    <div class="empty" id="t-empty">Choose your settings and generate a set of equations.</div>
  </div>

</div>

<script>
"use strict";

/* === app version ====================================================== */
const VERSION = "1.1.5";   // bump on every new iteration in this conversation

/* ========================================================================
   STATE & PERSISTENCE
   localStorage keeps settings between visits in a normal browser. Inside the
   Claude artifact sandbox storage is blocked, so every call is wrapped in
   try/catch and the app falls back to in-memory defaults there.
   ======================================================================== */
const STORE_KEY = "mathPractice.settings.v3";

const defaults = {
  ops:{add:true, sub:true, mul:false, div:false},
  opMin:0, opMax:20, resMin:0, resMax:20,
  count:10, operands:2, brackets:0, dplaces:2,
  decimals:false, autoBracket:true, showCorrect:false,
  settingsCollapsed:false, resultsCollapsed:true,
  lang:"cs"
};
let S = Object.assign({}, defaults, {ops:Object.assign({}, defaults.ops)});

function loadSettings(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(raw){
      const p = JSON.parse(raw);
      S = Object.assign({}, defaults, p, {ops:Object.assign({}, defaults.ops, p.ops||{})});
    }
  }catch(e){ /* sandbox: storage unavailable, keep defaults */ }
}
function saveSettings(){
  try{ localStorage.setItem(STORE_KEY, JSON.stringify(S)); }
  catch(e){ /* sandbox: storage unavailable, ignore */ }
}

/* ========================================================================
   TRANSLATIONS
   ======================================================================== */
const T = {
  en:{
    title:"Math Practice",
    subtitle:"Practice addition, subtraction, multiplication and division.",
    settings:"Settings", results:"Results",
    add:"Addition", sub:"Subtraction", mul:"Multiplication", div:"Division",
    oprange:"Number range", resrange:"Result range", min:"min", max:"max",
    count:"Number of equations", operands:"Number of terms",
    brackets:"Bracket groups", dplaces:"Decimal places",
    decB:"Include decimals", decS:"Allow non-whole numbers",
    autoB:"Auto-bracket \u00d7 and \u00f7", autoS:"Always wrap \u00d7 and \u00f7 in brackets",
    showB:"Show correct answers", showS:"Reveal answers when checking",
    gen:"Generate equations", check:"Check answers", regen:"New set",
    empty:"Choose your settings and generate a set of equations.",
    warn:"These settings only allowed {n} of {total} equations. Try widening the number range, allowing more operations, or using fewer terms.",
    warnNone:"These settings can't produce valid equations. Try widening the number range, allowing more operations, or using fewer terms.",
    correct:"correct", missing:"unanswered", noOps:"Select at least one operation."
  },
  cs:{
    title:"Procvi\u010dov\u00e1n\u00ed po\u010d\u00edt\u00e1n\u00ed",
    subtitle:"Procvi\u010duj s\u010d\u00edt\u00e1n\u00ed, od\u010d\u00edt\u00e1n\u00ed, n\u00e1soben\u00ed a d\u011blen\u00ed.",
    settings:"Nastaven\u00ed", results:"V\u00fdsledky",
    add:"S\u010d\u00edt\u00e1n\u00ed", sub:"Od\u010d\u00edt\u00e1n\u00ed", mul:"N\u00e1soben\u00ed", div:"D\u011blen\u00ed",
    oprange:"Rozsah \u010d\u00edsel", resrange:"Rozsah v\u00fdsledku", min:"min", max:"max",
    count:"Po\u010det p\u0159\u00edklad\u016f", operands:"Po\u010det \u010dlen\u016f",
    brackets:"Po\u010det z\u00e1vorek", dplaces:"Desetinn\u00e1 m\u00edsta",
    decB:"Desetinn\u00e1 \u010d\u00edsla", decS:"Povolit necel\u00e1 \u010d\u00edsla",
    autoB:"Automaticky z\u00e1vorkovat \u00d7 a \u00f7", autoS:"V\u017edy uzav\u00edrat \u00d7 a \u00f7 do z\u00e1vorek",
    showB:"Zobrazit spr\u00e1vn\u00e9 v\u00fdsledky", showS:"Uk\u00e1zat v\u00fdsledky p\u0159i kontrole",
    gen:"Vytvo\u0159it p\u0159\u00edklady", check:"Zkontrolovat", regen:"Nov\u00e1 sada",
    empty:"Zvol nastaven\u00ed a vytvo\u0159 sadu p\u0159\u00edklad\u016f.",
    warn:"Toto nastaven\u00ed umo\u017enilo vytvo\u0159it jen {n} z {total} p\u0159\u00edklad\u016f. Zkus roz\u0161\u00ed\u0159it rozsah \u010d\u00edsel, povolit v\u00edce operac\u00ed nebo zmen\u0161it po\u010det \u010dlen\u016f.",
    warnNone:"S t\u00edmto nastaven\u00edm nelze vytvo\u0159it p\u0159\u00edklady. Zkus roz\u0161\u00ed\u0159it rozsah \u010d\u00edsel, povolit v\u00edce operac\u00ed nebo zmen\u0161it po\u010det \u010dlen\u016f.",
    correct:"spr\u00e1vn\u011b", missing:"nevypln\u011bno", noOps:"Vyber alespo\u0148 jednu operaci."
  }
};
function tr(k){ return (T[S.lang]||T.en)[k]; }

/* collapse chevron markup, reused by dynamically built cards */
const CHEV = '<svg class="chev" viewBox="0 0 16 16"><path d="M4 6 L8 10 L12 6" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>';

/* ========================================================================
   RESULT ICONS  (standard Unicode emoji)
     correct   -> star-struck face
     incorrect -> thinking face
     unanswered-> upside-down face
   ======================================================================== */
const FACE_EMOJI = { ok:"\uD83E\uDD29", bad:"\uD83E\uDD14", empty:"\uD83D\uDE43" };

/* ========================================================================
   NUMBER HELPERS  (all generation is done in integer "ticks")
   real value  =  ticks / scale      scale = 1, 10 or 100
   ======================================================================== */
let scale = 1;
function computeScale(){ return S.decimals ? Math.pow(10, S.dplaces) : 1; }

function fmt(ticks){
  const v = ticks / scale;
  let str = (scale === 1) ? String(v) : v.toFixed(S.dplaces);
  if(S.lang === "cs") str = str.replace(".", ",");
  return str;
}
function parseAns(raw){
  if(raw == null) return null;
  const cleaned = String(raw).trim().replace(",", ".");
  if(cleaned === "") return null;
  const v = parseFloat(cleaned);
  if(!isFinite(v)) return null;
  return Math.round(v * scale);
}
function randInt(lo, hi){
  if(hi < lo) return null;
  return lo + Math.floor(Math.random() * (hi - lo + 1));
}
function shuffle(a){
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); const t=a[i];a[i]=a[j];a[j]=t; }
  return a;
}

/* ========================================================================
   GENERATION ENGINE  --  target-driven recursive build
   ======================================================================== */
const NODE_TRIES = 18;
const STEP_BUDGET = 35000;

function build(leaves, target, ops, opMinT, opMaxT, st){
  if(++st.steps > STEP_BUDGET) return null;
  if(leaves === 1){
    return (target >= opMinT && target <= opMaxT) ? {leaf:true, val:target} : null;
  }
  for(let attempt=0; attempt<NODE_TRIES; attempt++){
    if(st.steps > STEP_BUDGET) return null;
    const op = ops[Math.floor(Math.random()*ops.length)];
    const kL = randInt(1, leaves-1), kR = leaves - kL;
    const leafL = (kL===1), leafR = (kR===1);
    let tL=null, tR=null;

    if(op === "+"){
      let loL = leafL ? opMinT : 0;
      let hiL = leafL ? opMaxT : target;
      if(leafR){ loL = Math.max(loL, target-opMaxT); hiL = Math.min(hiL, target-opMinT); }
      hiL = Math.min(hiL, target);
      tL = randInt(loL, hiL);
      if(tL === null) continue;
      tR = target - tL;
    }
    else if(op === "-"){
      let loR = leafR ? Math.max(0,opMinT) : 0;
      let hiR = leafR ? opMaxT : opMaxT * kR;
      if(leafL){ loR = Math.max(loR, opMinT-target); hiR = Math.min(hiR, opMaxT-target); }
      tR = randInt(loR, hiR);
      if(tR === null) continue;
      tL = target + tR;
    }
    else if(op === "*"){
      const M = target * scale;
      if(M === 0){
        if(Math.random()<0.5){ tL = 0; tR = randInt(Math.max(1,opMinT), opMaxT); }
        else { tR = 0; tL = randInt(Math.max(1,opMinT), opMaxT); }
        if(tL === null || tR === null) continue;
      } else {
        const pairs = [];
        const lim = Math.floor(Math.sqrt(M));
        for(let d=1; d<=lim; d++){
          if(M % d === 0){ pairs.push([d, M/d]); pairs.push([M/d, d]); }
        }
        shuffle(pairs);
        let picked = null;
        for(let p=0;p<pairs.length;p++){
          const a=pairs[p][0], b=pairs[p][1];
          if(leafL && (a<opMinT || a>opMaxT)) continue;
          if(leafR && (b<opMinT || b>opMaxT)) continue;
          picked = pairs[p]; break;
        }
        if(!picked) continue;
        tL = picked[0]; tR = picked[1];
      }
    }
    else { /* "/" */
      const loR = leafR ? Math.max(1,opMinT) : 1;
      const hiR = opMaxT;
      let found = false;
      const range = [];
      for(let r=loR;r<=hiR;r++) range.push(r);
      shuffle(range);
      for(let q=0;q<range.length;q++){
        const r = range[q];
        const num = target * r;
        if(num % scale !== 0) continue;
        const a = num / scale;
        if(leafL && (a<opMinT || a>opMaxT)) continue;
        tR = r; tL = a; found = true; break;
      }
      if(!found) continue;
    }

    const L = build(kL, tL, ops, opMinT, opMaxT, st);
    if(!L) continue;
    const R = build(kR, tR, ops, opMinT, opMaxT, st);
    if(!R) continue;
    return {leaf:false, op, L, R};
  }
  return null;
}

function precOf(op){ return (op==="+"||op==="-") ? 1 : 2; }
const SYM = {"+":"+","-":"\u2212","*":"\u00d7","/":"\u00f7"};

function needsBracket(prec, parentPrec, isRight, parentOp, cosmetic){
  if(prec < parentPrec) return true;
  if(prec === parentPrec && isRight && (parentOp==="-"||parentOp==="/")) return true;
  if(cosmetic && prec === 2 && parentPrec === 1) return true;
  return false;
}

function render(node, parentPrec, isRight, parentOp, cosmetic){
  if(node.leaf) return fmt(node.val);
  const prec = precOf(node.op);
  const s = render(node.L,prec,false,node.op,cosmetic)+" "+SYM[node.op]+" "+render(node.R,prec,true,node.op,cosmetic);
  return needsBracket(prec,parentPrec,isRight,parentOp,cosmetic) ? "("+s+")" : s;
}

function evaluate(node){
  if(node.leaf) return node.val;
  const a = evaluate(node.L), b = evaluate(node.R);
  switch(node.op){
    case "+": return a + b;
    case "-": return a - b;
    case "*": return a * b / scale;
    case "/": return a * scale / b;
  }
}

/* expression with every outermost bracketed group collapsed to its value */
function renderIntermediate(node, parentPrec, isRight, parentOp, cosmetic){
  if(node.leaf) return fmt(node.val);
  const prec = precOf(node.op);
  if(needsBracket(prec,parentPrec,isRight,parentOp,cosmetic)){
    return "("+fmt(Math.round(evaluate(node)))+")";
  }
  return renderIntermediate(node.L,prec,false,node.op,cosmetic)+" "+SYM[node.op]
       + " "+renderIntermediate(node.R,prec,true,node.op,cosmetic);
}

function workedSolution(eq){
  const orig = render(eq.tree,0,false,null,S.autoBracket);
  const ans = fmt(eq.answer);
  if(orig.indexOf("(") !== -1){
    const mid = renderIntermediate(eq.tree,0,false,null,S.autoBracket);
    return orig + " = " + mid + " = " + ans;
  }
  return orig + " = " + ans;
}

/* generate one equation; bracket count is matched against the number of
   STRUCTURAL brackets (a +/- nested inside x or /). Auto-bracket is applied
   only at render time and adds cosmetic brackets around x and / on top. */
function generateOne(leaves, ops, opMinT, opMaxT, resMinT, resMaxT, wantBrackets){
  const candidates = [];
  for(let tries=0; tries<70; tries++){
    const target = randInt(resMinT, resMaxT);
    if(target === null) break;
    const st = {steps:0};
    const tree = build(leaves, target, ops, opMinT, opMaxT, st);
    if(!tree) continue;
    const brackets = (render(tree,0,false,null,false).match(/\(/g)||[]).length;
    candidates.push({tree, answer:target, brackets});
    if(brackets === wantBrackets && candidates.length >= 3) break;
  }
  if(candidates.length === 0) return null;
  const exact = candidates.filter(function(c){return c.brackets===wantBrackets;});
  if(exact.length) return exact[Math.floor(Math.random()*exact.length)];
  const under = candidates.filter(function(c){return c.brackets<=wantBrackets;})
                          .sort(function(a,b){return b.brackets-a.brackets;});
  if(under.length) return under[0];
  return candidates.sort(function(a,b){return a.brackets-b.brackets;})[0];
}

/* ========================================================================
   APP LOGIC
   ======================================================================== */
let equations = [];

function readInputsToState(){
  S.opMin = parseInt(document.getElementById("opMin").value,10);
  S.opMax = parseInt(document.getElementById("opMax").value,10);
  S.resMin = parseInt(document.getElementById("resMin").value,10);
  S.resMax = parseInt(document.getElementById("resMax").value,10);
  S.count = parseInt(document.getElementById("count").value,10);
  S.operands = parseInt(document.getElementById("operands").value,10);
  S.brackets = parseInt(document.getElementById("brackets").value,10);
  S.dplaces = parseInt(document.getElementById("dplaces").value,10);
  S.decimals = document.getElementById("decimals").checked;
  S.autoBracket = document.getElementById("autoBracket").checked;
  S.showCorrect = document.getElementById("showCorrect").checked;
  if(!isFinite(S.opMin)) S.opMin = 0;
  if(!isFinite(S.opMax)) S.opMax = 20;
  if(!isFinite(S.resMin)) S.resMin = 0;
  if(!isFinite(S.resMax)) S.resMax = 20;
  if(S.opMax < S.opMin) S.opMax = S.opMin;
  if(S.resMax < S.resMin) S.resMax = S.resMin;
  saveSettings();
}

function generate(){
  readInputsToState();
  const board = document.getElementById("board");

  const ops = Object.keys(S.ops).filter(function(k){return S.ops[k];})
                    .map(function(k){return {add:"+",sub:"-",mul:"*",div:"/"}[k];});
  if(ops.length === 0){
    board.innerHTML = '<div class="warn">'+tr("noOps")+'</div>';
    return;
  }

  scale = computeScale();
  const opMinT = Math.round(S.opMin*scale), opMaxT = Math.round(S.opMax*scale);
  const resMinT = Math.round(S.resMin*scale), resMaxT = Math.round(S.resMax*scale);

  equations = [];
  for(let i=0;i<S.count;i++){
    const eq = generateOne(S.operands, ops, opMinT, opMaxT, resMinT, resMaxT, S.brackets);
    if(eq) equations.push(eq);
  }
  renderBoard();
}

function renderBoard(){
  const board = document.getElementById("board");
  if(equations.length === 0){
    board.innerHTML = '<div class="warn">'+tr("warnNone")+'</div>';
    return;
  }
  let html = "";
  if(equations.length < S.count){
    html += '<div class="warn">'+tr("warn").replace("{n}",equations.length).replace("{total}",S.count)+'</div>';
  }
  equations.forEach(function(eq,i){
    eq.expr = render(eq.tree,0,false,null,S.autoBracket);
    html += '<div class="eq" style="animation-delay:'+(i*32)+'ms">'
          +   '<span class="idx">'+(i+1)+'</span>'
          +   '<span class="expr">'+eq.expr+' =</span>'
          +   '<input class="ans" data-i="'+i+'" inputmode="decimal" autocomplete="off">'
          +   '<span class="mark" data-mark="'+i+'"></span>'
          +   '<span class="correct" data-correct="'+i+'"></span>'
          + '</div>';
  });
  html += '<div class="actions">'
        +   '<button class="btn btn-primary" onclick="checkAll()">'+tr("check")+'</button>'
        + '</div>'
        + '<div class="card score" id="score" style="display:none"></div>';
  board.innerHTML = html;
}

/* grade one equation; returns 'ok' | 'bad' | 'empty' */
function gradeRow(i){
  const eq = equations[i];
  const input = document.querySelector('input.ans[data-i="'+i+'"]');
  const mark  = document.querySelector('[data-mark="'+i+'"]');
  const corr  = document.querySelector('[data-correct="'+i+'"]');
  const given = parseAns(input.value);
  let status;
  if(given === null) status = "empty";
  else if(given === eq.answer) status = "ok";
  else status = "bad";

  input.classList.remove("ok","bad");
  if(status === "ok") input.classList.add("ok");
  else if(status === "bad") input.classList.add("bad");

  mark.textContent = FACE_EMOJI[status];
  /* worked solution (with intermediate step) is shown for every completed
     answer -- correct and incorrect alike -- but never for blank ones */
  corr.textContent = (status !== "empty" && S.showCorrect) ? workedSolution(eq) : "";
  return status;
}

function checkAll(){
  equations.forEach(function(eq,i){ gradeRow(i); });
  updateScore();
}

/* percentage uses only filled answers; two progress bars frame it:
   top  = green/grey  -> complete vs incomplete
   bottom = green/red -> correct vs incorrect.
   The whole panel is a collapsible card (collapsed by default). */
function updateScore(){
  let correct = 0, filled = 0, missing = 0;
  equations.forEach(function(eq,i){
    const input = document.querySelector('input.ans[data-i="'+i+'"]');
    const given = parseAns(input.value);
    if(given === null){ missing++; return; }
    filled++;
    if(given === eq.answer) correct++;
  });
  const total = equations.length;
  const incorrect = filled - correct;
  const pct = filled ? Math.round(correct/filled*100) : 0;
  const completePct = total ? (filled/total*100) : 0;
  const okPct  = filled ? (correct/filled*100) : 0;
  const badPct = filled ? (incorrect/filled*100) : 0;

  let detail = correct+" / "+filled+" "+tr("correct");
  if(missing > 0) detail += "  \u00b7  "+missing+" "+tr("missing");

  const el = document.getElementById("score");
  if(!el) return;
  el.style.display = "block";
  el.classList.toggle("collapsed", S.resultsCollapsed);
  el.innerHTML =
      '<div class="card-head" onclick="toggleResults()">'
    +   '<span class="card-title">'+tr("results")+'</span>'+CHEV
    + '</div>'
    + '<div class="card-body">'
    +   '<div class="pbar top"><div style="width:'+completePct+'%;background:var(--ok)"></div></div>'
    +   '<div class="pct">'+pct+'%</div>'
    +   '<div class="detail">'+detail+'</div>'
    +   '<div class="pbar bottom">'
    +     '<div style="width:'+okPct+'%;background:var(--ok)"></div>'
    +     '<div style="width:'+badPct+'%;background:var(--bad)"></div>'
    +   '</div>'
    + '</div>';
}

/* ========================================================================
   UI WIRING
   ======================================================================== */
const OP_DEFS = [
  {key:"add", sym:"+"}, {key:"sub", sym:"\u2212"},
  {key:"mul", sym:"\u00d7"}, {key:"div", sym:"\u00f7"}
];

function buildOpChips(){
  const c = document.getElementById("ops");
  c.innerHTML = "";
  OP_DEFS.forEach(function(o){
    const chip = document.createElement("div");
    chip.className = "op-chip" + (S.ops[o.key] ? " on" : "");
    chip.innerHTML = '<span class="sym">'+o.sym+'</span><span class="lbl">'+tr(o.key)+'</span>';
    chip.onclick = function(){
      S.ops[o.key] = !S.ops[o.key];
      chip.classList.toggle("on", S.ops[o.key]);
      saveSettings();
    };
    c.appendChild(chip);
  });
}

function syncDecimalUI(){
  document.getElementById("dplaces-field").style.opacity = S.decimals ? "1" : ".4";
  document.getElementById("dplaces").disabled = !S.decimals;
}
function applyCollapse(){
  document.getElementById("settings-card").classList.toggle("collapsed", S.settingsCollapsed);
}
function toggleSettings(){
  S.settingsCollapsed = !S.settingsCollapsed;
  saveSettings();
  applyCollapse();
}
function toggleResults(){
  S.resultsCollapsed = !S.resultsCollapsed;
  saveSettings();
  const el = document.getElementById("score");
  if(el) el.classList.toggle("collapsed", S.resultsCollapsed);
}

function applyTranslations(){
  const map = {
    "t-title":"title","t-subtitle":"subtitle","t-settings":"settings",
    "t-oprange":"oprange","t-resrange":"resrange","t-count":"count",
    "t-operands":"operands","t-brackets":"brackets","t-dplaces":"dplaces",
    "t-dec-b":"decB","t-dec-s":"decS","t-auto-b":"autoB","t-auto-s":"autoS",
    "t-show-b":"showB","t-show-s":"showS","t-empty":"empty",
    "t-min1":"min","t-max1":"max","t-min2":"min","t-max2":"max"
  };
  for(const id in map){ const el=document.getElementById(id); if(el) el.textContent=tr(map[id]); }
  document.title = tr("title");
  document.getElementById("btn-gen").textContent = tr("gen");
  document.documentElement.lang = S.lang;
  document.getElementById("lang-en").classList.toggle("on", S.lang==="en");
  document.getElementById("lang-cs").classList.toggle("on", S.lang==="cs");
  buildOpChips();
}

function setLang(l){
  S.lang = l;
  saveSettings();
  applyTranslations();
  if(equations.length){ renderBoard(); }
}

function initInputs(){
  const set = function(id,val){ const e=document.getElementById(id); if(e) e.value=val; };
  set("opMin",S.opMin); set("opMax",S.opMax);
  set("resMin",S.resMin); set("resMax",S.resMax);
  set("count",S.count); set("operands",S.operands);
  set("brackets",S.brackets); set("dplaces",S.dplaces);
  document.getElementById("decimals").checked = S.decimals;
  document.getElementById("autoBracket").checked = S.autoBracket;
  document.getElementById("showCorrect").checked = S.showCorrect;

  ["opMin","opMax","resMin","resMax","count","operands","brackets","dplaces"]
    .forEach(function(id){
      document.getElementById(id).addEventListener("change", readInputsToState);
    });
  document.getElementById("decimals").addEventListener("change", function(e){
    S.decimals=e.target.checked; saveSettings(); syncDecimalUI();
  });
  document.getElementById("autoBracket").addEventListener("change", function(e){
    S.autoBracket=e.target.checked; saveSettings();
  });
  document.getElementById("showCorrect").addEventListener("change", function(e){
    S.showCorrect=e.target.checked; saveSettings();
  });
}

/* ---- boot ---- */
loadSettings();
initInputs();
applyTranslations();
syncDecimalUI();
applyCollapse();
(function(){ const v=document.getElementById("ver"); if(v) v.textContent="v"+VERSION; })();
</script>
